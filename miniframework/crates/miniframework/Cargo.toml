[package]
name = "miniframework"
version = "0.1.0"
edition = "2021"
# The Xtensa `esp` toolchain lags stable; keep this at or below its rustc.
rust-version = "1.88"
description = "Small HTTP(S) + wire-format framework for web apps served from ESP32 boards"
license = "MIT"
publish = false

[features]
default = ["gzip"]
# Dynamic gzip of API responses and gzip request bodies (miniz_oxide).
gzip = ["dep:miniz_oxide"]
# The ESP-IDF runner: Wi-Fi, esp-tls handshakes, mDNS, SNTP, NVS, HTTP client.
esp32 = ["dep:esp-idf-svc"]
# Report (and erase) a crash's core dump at the next boot. Only for apps whose
# sdkconfig sets CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH and that have a
# `coredump` partition: without them ESP-IDF has no core-dump functions.
coredump = ["esp32"]

[dependencies]
httparse = "1.10"
ryu = "1"
sha2 = { version = "0.10", default-features = false }
getrandom = "0.2"
crc32fast = "1.4"
log = "0.4"
miniz_oxide = { version = "0.8", optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "=0.52.1", optional = true, features = ["experimental"] }

[dev-dependencies]
# Reference decoders: every hand-written encoder is checked against them.
serde_json = "1"
ciborium = "0.2"
rmpv = "1"
