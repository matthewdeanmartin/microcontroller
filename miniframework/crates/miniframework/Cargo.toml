[package]
name = "miniframework"
version = "0.1.0"
edition = "2021"
# The Xtensa `esp` toolchain lags stable; keep this at or below its rustc.
rust-version = "1.88"
description = "Small HTTP(S) + wire-format framework for web apps served from ESP32 boards"
license = "MIT"
publish = false

[features]
rate-limit = []
queue = []
# Browser sessions (cookie, stored as SHA-256), and a same-origin guard for
# cookie-authenticated APIs. No network code; see spec/OAUTH.md.
session = []
# "Sign in with Mastodon": OAuth 2 code + PKCE client; network steps on an
# app-provided worker. Needs an HTTP client that implements `Fetch::send`.
oauth = ["session"]
# The ESP32 HTTPS client may trust public CAs too (ESP-IDF's certificate
# bundle; the app's sdkconfig must keep CONFIG_MBEDTLS_CERTIFICATE_BUNDLE).
public-ca = ["esp32"]
# `/.well-known/ops/health`: the board's own checks plus the app's, for the
# SRE bot. Read-only; no network code. See spec/OPS.md.
ops = []
# Local vanilla-JS Wi-Fi provisioning portal; no UI or worker unless opted in.
wifi-setup = []
# Transports: plain HTTP is always there. `tls` adds HTTPS (the boards'
# esp-tls server sessions; without it no TLS server code is linked), and
# `http2` adds HTTP/2 on top (ALPN over TLS on boards; cleartext
# prior-knowledge h2c anywhere, for tests and tools).
default = ["gzip", "tls"]
tls = []
http2 = ["tls", "dep:fluke-hpack"]
# Dynamic gzip of API responses and gzip request bodies (miniz_oxide).
gzip = ["dep:miniz_oxide"]
# The ESP-IDF runner: Wi-Fi, esp-tls handshakes, mDNS, SNTP, NVS, HTTP client.
esp32 = ["dep:esp-idf-svc"]
# Report (and erase) a crash's core dump at the next boot. Only for apps whose
# sdkconfig sets CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH and that have a
# `coredump` partition: without them ESP-IDF has no core-dump functions.
coredump = ["esp32"]
# HTTPS on the desktop runner (rustls), with ALPN h2 when `http2` is on:
# local development and tests of the boards' HTTPS behaviour.
desktop-tls = ["tls", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]

[dependencies]
httparse = "1.10"
ryu = "1"
sha2 = { version = "0.10", default-features = false }
getrandom = "0.2"
crc32fast = "1.4"
log = "0.4"
miniz_oxide = { version = "0.8", optional = true }
fluke-hpack = { version = "0.3", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
# Public roots for the desktop HTTPS client (OAuth against real instances).
webpki-roots = { version = "1", optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "=0.52.1", optional = true, features = ["experimental"] }

[dev-dependencies]
# Reference decoders: every hand-written encoder is checked against them.
serde_json = "1"
ciborium = "0.2"
rmpv = "1"

[[example]]
name = "resource_protection"
required-features = ["rate-limit", "queue"]

[[example]]
name = "wifi_setup"
required-features = ["wifi-setup"]
