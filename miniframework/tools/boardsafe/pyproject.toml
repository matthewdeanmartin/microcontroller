[project]
name = "boardsafe"
version = "0.1.0"
description = "Board identity checks before a flash, and strict live probes after: the right image on the right board, data partitions untouched"
requires-python = ">=3.11"
# The library itself is standard-library only, so an app's scripts can also
# import it from ESP-IDF's Python (which has esptool). esptool and pyserial
# are needed only to talk to a board.
dependencies = [
  "esptool>=4.7,<5",
  "pyserial>=3.5",
]

[project.scripts]
boardsafe-image = "boardsafe.image:main"
boardsafe-update = "boardsafe.flash:main"
boardsafe-probe = "boardsafe.probe:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardsafe"]
