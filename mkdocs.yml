site_name: "microcontroller"
site_author: "Matthew Dean Martin <matthewdeanmartin@gmail.com>"
site_description: "Microcontroller experiments - ESP32 and friends"

repo_url: "https://github.com/matthewdeanmartin/microcontroller"

docs_dir: docs

theme:
  name: readthedocs
  features:
    - navigation.footer

edit_uri: edit/main/docs/

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - toc:
      permalink: true

nav:
  - "Home": "index.md"
  - "Basic Setup":
      - "Overview": "basic_setup/index.md"
      - "The Board": "basic_setup/the_board.md"
      - "Toolchain Setup": "basic_setup/toolchain.md"
      - "The Project": "basic_setup/the_project.md"
      - "Build, Flash, Monitor": "basic_setup/build_flash_monitor.md"
      - "Troubleshooting": "basic_setup/troubleshooting.md"
  - "MicroPython":
      - "Overview": "micropython/index.md"
      - "How It Works": "micropython/how_it_works.md"
      - "Setup": "micropython/setup.md"
      - "The Workflow": "micropython/workflow.md"
      - "Finding It On Your Network": "micropython/finding_it.md"
      - "Signal and Placement": "micropython/signal_and_placement.md"
      - "The REPL": "micropython/repl.md"
      - "Trade-offs": "micropython/trade_offs.md"
  - "Secret Messages":
      - "Overview": "secret_messages/index.md"
      - "How The Encryption Works": "secret_messages/encryption.md"
      - "Running It": "secret_messages/running.md"
      - "The Board Tab": "secret_messages/diagnostics.md"
      - "Mastodon": "secret_messages/mastodon.md"
      - "Publishing The Front End": "secret_messages/publishing.md"
  - "ESP32-S3":
      - "Overview": "esp32s3/index.md"
  - "TinyGo and NanaCoin":
      - "Overview": "tinygo/index.md"
      - "How It Works": "tinygo/how_it_works.md"
      - "Setup": "tinygo/setup.md"
      - "The Workflow": "tinygo/workflow.md"
      - "Memory": "tinygo/memory.md"
      - "The Web Framework": "tinygo/web_framework.md"
      - "NanaCoin's Domain": "tinygo/nanacoin.md"
      - "Storage and Retries": "tinygo/storage.md"
      - "Concurrency and Cores": "tinygo/concurrency.md"
      - "Diagnostics and Load Tests": "tinygo/diagnostics.md"

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

plugins:
  - search

